      "@context": "https://schema.org",

      "name": "EduSphere AI",

        "Student and teacher management",

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html { -webkit-text-size-adjust: 100%; }
      body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
      #root { min-height: 100dvh; }
    </style>
    <script>
      // Prevent dark mode flash – apply theme before React
      (function(){
        try {
          var t = localStorage.getItem('edusphere-theme') || 'dark';
          var m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var r = t === 'system' ? m : t;
          document.documentElement.classList.add(r);
          document.documentElement.style.colorScheme = r;
        } catch(e){}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; line-height: 1.6;">
        <h1>EduSphere AI – Smart School Management &amp; Attendance</h1>
        <p>EduSphere AI is an AI-powered school management and attendance system. It brings
        face-recognition attendance, an AI assistant for teachers, student and teacher records,
        marks with printable report cards and merit lists, WhatsApp parent updates, timetables,
        an academic calendar, and one-tap PDF reports — all in a fast, offline-capable,
        mobile-first progressive web app that runs on any device.</p>
        <p>EduSphere AI is a JavaScript application. Please enable JavaScript and reload the page to continue.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
